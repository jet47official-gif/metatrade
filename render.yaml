# Meta Trade - Render Blueprint
# Deploy this repo to your new Render account:
#   1. New > Blueprint > connect this repo
#   2. Create the MongoDB (or use MongoDB Atlas) and set MONGODB_URI
#   3. After the API is live, set VITE_API_URL on the web service to <api-url>/api
services:
  # Backend API
  - type: web
    name: meta-trade-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false

  # Frontend (Vite static site)
  - type: static_site
    name: meta-trade-web
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    staticRewrites:
      - source: "/*"
        destination: "/index.html"
        status: 200
